experiment:
  name: bandwidth_marginal_sweep_v4_retrain
  description: "Isolated faithful rerun of the pinned sibling bandwidth/marginal cells"
  seed: 31
  output_dir: results/v4_tcdp/sibling_retraining/closure_20260908/bandwidth_source_rerun
  log_level: INFO

circuit:
  family: lattice
  n_qubits: [9]
  n_generators: n
  lattice:
    dimension: 2
    range: 1

kernel:
  type: gaussian
  bandwidth: [1.0, 3.0, 9.0, 27.0]

init:
  scheme: uniform
  uniform:
    low: -3.14159265
    high: 3.14159265

dataset:
  type: binary_mixture
  n_samples: 512
  binary_mixture:
    n_modes: 4
    noise: 0.1

estimation:
  num_a_samples: 128
  num_z_samples: 256
  num_seeds: 100
  use_jax: true
  batch_size: 64

training:
  optimizer: adam
  lr: 0.03
  num_steps: 20
  checkpoint_every: 5
  loss_mode: exact_small_n
  exact_loss_max_n: 12
  diagnostics:
    enabled: true
    distribution_mode: exact
    exact_probability_max_n: 12
    sample_from_exact_probability_max_n: 12
    sample_count: 4096
    max_order: 9
    max_subsets_per_order: 128
    anti_concentration:
      alphas: [0.5, 1.0, 2.0]
      primary_alpha: 1.0
      beta_min: 0.25
      second_moment_threshold: 1.0
